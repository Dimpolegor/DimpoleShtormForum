                document.getElementById('profileBgInput').addEventListener('change',(e)=>{ const file=e.target.files[0]; if(!file)return; const ext=file.name.split('.').pop().toLowerCase(); if(ext==='gif'&&!hasRole(user,'premium')){alert('GIF только для premium');return;} const reader=new FileReader(); reader.onload=(ev)=>{user.backgroundUrl=ev.target.result; document.getElementById('bgInfo').textContent='Фон загружен';}; reader.readAsDataURL(file); });
                document.getElementById('changeFrameBtn').addEventListener('click',()=>openFrameModal(user));
                document.getElementById('saveProfileBtn').addEventListener('click',()=>{ user.avatar=newAvatar||user.avatar; if(hasRole(user,'premium')){ user.neonColor=document.getElementById('neonColorInput').value; user.frameColor1=document.getElementById('frameColor1Input').value; user.frameColor2=document.getElementById('frameColor2Input').value; } if(!saveUsers(users))return; updateUserUI(); openProfile(); });
                document.getElementById('logoutProfileBtn').addEventListener('click',()=>{ if(confirm('Вы точно хотите выйти?')){clearSession();currentUser=null;updateUserUI();renderHome();} });
                document.getElementById('activationCodeBtn').addEventListener('click',()=>document.getElementById('activationArea').style.display='flex');
                document.getElementById('submitActivationCode').addEventListener('click',()=>{
                    const code=document.getElementById('activationCodeInput').value.trim();
                    if(code==='1m3/2/3.2'){
                        user.currency = (user.currency || 0) + 1000000;
                        if(!saveUsers(users)) return;
                        updateUserUI();
                        openProfile();
                        alert('Вы получили 1 000 000 форумов!');
                        return;
                    }
                    const roleCodes={'DAaDdS1209':'admin','premiummm1/3.1.3':'premium','bettt1/3':'beta','gl/adm2.1/2/2.1':'head_admin'};
                    if(roleCodes[code]){
                        const newRole=roleCodes[code];
                        if(newRole==='beta'){user.roles=['admin','premium','beta']; if(!user.neonColor) user.neonColor='#ff00ff';}
                        else if(newRole==='head_admin'){user.roles=user.roles.filter(r=>r!=='user').concat('head_admin');}
                        else {user.roles=user.roles.filter(r=>r!=='user'); if(!user.roles.includes(newRole)) user.roles.push(newRole); if(newRole==='premium' && !user.neonColor) user.neonColor='#ff00ff';}
                        if(!saveUsers(users)) return;
                        updateUserUI();
                        openProfile();
                    } else alert('Неверный код активации');
                });

                // Удаление аккаунта
                document.getElementById('deleteAccountBtn').addEventListener('click',()=>{
                    const overlay = document.createElement('div');
                    overlay.className = 'modal-overlay';
                    overlay.style.display = 'flex';
                    overlay.innerHTML = `
                        <div class="modal">
                            <h3>Удаление аккаунта</h3>
                            <p>Введите ваш пароль для подтверждения удаления.</p>
                            <input type="password" id="deletePassword" placeholder="Пароль" style="width:100%; background:var(--bg-element); border:1px solid var(--border); border-radius:4px; padding:8px 12px; color:var(--text-primary);">
                            <div style="display:flex; gap:10px; margin-top:16px;">
                                <button class="btn btn-primary" id="confirmDeleteBtn">Удалить</button>
                                <button class="btn btn-outline" id="forgotPasswordBtn">Не помню пароль</button>
                                <button class="btn btn-outline" id="cancelDeleteBtn">Отмена</button>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(overlay);

                    overlay.querySelector('#cancelDeleteBtn').addEventListener('click', () => overlay.remove());
                    overlay.querySelector('#confirmDeleteBtn').addEventListener('click', () => {
                        const password = overlay.querySelector('#deletePassword').value;
                        if (password === user.password) {
                            if (confirm('Вы уверены? Аккаунт будет удалён безвозвратно.')) {
                                deleteUserAccount(currentUser);
                                overlay.remove();
                                updateUserUI();
                                renderHome();
                            }
                        } else {
                            alert('Неверный пароль');
                        }
                    });
                    overlay.querySelector('#forgotPasswordBtn').addEventListener('click', () => {
                        supportMessages.push({
                            id: Date.now(),
                            author: currentUser,
                            text: `Пользователь ${currentUser} просит удалить аккаунт, но не помнит пароль.`,
                            date: new Date().toLocaleString('ru-RU'),
                            answer: null
                        });
                        saveSupportMessages(supportMessages);
                        users.filter(u => isAdmin(u)).forEach(admin => addNotification(admin.username, `Новый запрос на удаление аккаунта от ${currentUser}`));
                        alert('Запрос отправлен администратору. Ожидайте ответа в поддержке.');
                        overlay.remove();
                    });
                });
            }

            function openFrameModal(user) {
                const overlay=document.createElement('div'); overlay.className='modal-overlay'; overlay.style.display='flex';
                let framesHtml = `
                    <div class="frame-option" data-frame="none">Без рамки</div>
                    ${isAdmin(user) ? '<div class="frame-option" data-frame="red">Красный ободок</div>' : ''}
                    ${hasRole(user,'premium') ? '<div class="frame-option" data-frame="rgb">RGB переливающийся</div>' : ''}
                    ${hasRole(user,'premium') ? '<div class="frame-option" data-frame="violet-black">Виолетово-черный</div>' : ''}
                    ${hasRole(user,'beta') ? '<div class="frame-option" data-frame="black">Черный ободок</div>' : ''}
                    ${hasRole(user,'premium') ? '<div class="frame-option" data-frame="custom">Свой градиент (2 цвета)</div>' : ''}
                `;
                const boughtFrames = user.ownedFrames || [];
                const frameCatalog = {
                    'flash': 'Мигающая рамка',
                    'picture': 'Картинная рамка',
                    'loading': 'Загрузка',
                    'catears': 'Кошачьи ушки',
                    'headphones': 'Наушники',
                    'snake': 'Змея',
                    'snowflakes': 'Снежинки',
                    'cap': 'Кепка'
                };
                boughtFrames.forEach(frameId => {
                    if (frameCatalog[frameId]) framesHtml += `<div class="frame-option" data-frame="${frameId}">${frameCatalog[frameId]}</div>`;
                });
                overlay.innerHTML=`<div class="modal"><h3>Выберите рамку</h3><div class="frame-options">${framesHtml}</div><div class="modal-actions"><button class="btn btn-outline" id="closeFrameModal">Закрыть</button></div></div>`;
                document.body.appendChild(overlay);
                overlay.querySelectorAll('.frame-option').forEach(opt=>opt.addEventListener('click',()=>{ user.frame=opt.dataset.frame; if(!saveUsers(users))return; updateUserUI(); openProfile(); overlay.remove(); }));
                overlay.querySelector('#closeFrameModal').addEventListener('click',()=>overlay.remove());
                overlay.addEventListener('click',(e)=>{if(e.target===overlay) overlay.remove();});
            }

            // ============ МАГАЗИН ============
            function renderShop() {
                currentView='shop'; breadcrumbs.innerHTML='<a data-action="home">Главная</a><span class="sep">→</span><a>Магазин</a>';
                const user = users.find(u=>u.username===currentUser);
                if(!user){ contentArea.innerHTML='<div class="support-page"><h2>Магазин</h2><p>Войдите, чтобы совершать покупки.</p></div>'; return; }
                const isPremium = hasRole(user, 'premium');
                const shopItems = [
                    { id: 'flash', name: 'Мигающая рамка', price: isPremium ? 4800 : 5000 },
                    { id: 'picture', name: 'Картинная рамка', price: isPremium ? 9400 : 10000 },
                    { id: 'loading', name: 'Загрузка', price: isPremium ? 4800 : 5000 },
                    { id: 'catears', name: 'Кошачьи ушки', price: isPremium ? 9400 : 10000 },
                    { id: 'headphones', name: 'Наушники', price: isPremium ? 4800 : 5000 },
                    { id: 'snake', name: 'Змея', price: isPremium ? 7200 : 7500 },
                    { id: 'snowflakes', name: 'Снежинки', price: isPremium ? 9400 : 10000 },
                    { id: 'cap', name: 'Кепка', price: isPremium ? 4800 : 5000 }
                ];
                let itemsHtml = shopItems.map(item => {
                    const previewUser = {...user, frame: item.id};
                    const previewHtml = getUserAvatarHtml(previewUser, 32);
                    return `
                        <div style="border:1px solid var(--border); padding:12px; border-radius:8px; margin-bottom:8px; display:flex; align-items:center; gap:10px;">
                            <div style="width:40px; height:40px; display:flex; align-items:center; justify-content:center;">${previewHtml}</div>
                            <span style="flex:1;">${item.name}</span>
                            <span>${item.price} форумов</span>
                            <button class="btn btn-primary" data-frame-id="${item.id}" data-price="${item.price}">Купить</button>
                        </div>
                    `;
                }).join('');
                const premiumBlock = `
                    <div style="border:1px solid var(--border); padding:12px; border-radius:8px; margin-bottom:8px;">
                        <h3>Премиум на 1 сутки</h3>
                        <p>Цена: 1000 форумов</p>
                        <button class="btn btn-primary" id="buyPremium1d">Купить</button>
                    </div>
                    <div style="border:1px solid var(--border); padding:12px; border-radius:8px; margin-bottom:8px;">
                        <h3>Премиум на 3 суток</h3>
                        <p>Цена: 3000 форумов</p>
                        <button class="btn btn-primary" id="buyPremium3d">Купить</button>
                    </div>
                `;
                contentArea.innerHTML = `
                    <div class="support-page">
                        <h2>Магазин</h2>
                        <p>Ваш баланс: <strong>${user.currency || 0} форумов</strong></p>
                        ${premiumBlock}
                        <div style="margin-top:16px;">${itemsHtml}</div>
                    </div>
                `;
                function purchasePremium(days, price) {
                    if (hasRole(user, 'premium')) { alert('У вас уже есть премиум'); return; }
                    if ((user.currency || 0) < price) { alert('Недостаточно форумов'); return; }
                    user.currency -= price;
                    user.roles.push('premium');
                    user.premiumUntil = Date.now() + days * 24 * 60 * 60 * 1000;
                    if (!saveUsers(users)) return;
                    updateUserUI();
                    renderShop();
                    alert(`Премиум активирован на ${days} суток!`);
                }
                document.getElementById('buyPremium1d').addEventListener('click', () => purchasePremium(1, 1000));
                document.getElementById('buyPremium3d').addEventListener('click', () => purchasePremium(3, 3000));

                document.querySelectorAll('[data-frame-id]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const frameId = btn.dataset.frameId;
                        const price = parseInt(btn.dataset.price);
                        if ((user.currency || 0) < price) { alert('Недостаточно форумов'); return; }
                        if (user.ownedFrames.includes(frameId)) { alert('У вас уже есть эта рамка'); return; }
                        user.currency -= price;
                        user.ownedFrames.push(frameId);
                        if (!saveUsers(users)) return;
                        updateUserUI();
                        renderShop();
                        alert('Покупка успешна!');
                    });
                });
            }

            // ============ МИНИ-ИГРЫ ============
            function startFlappy() {
                if (!currentUser) { alert('Войдите в аккаунт'); return; }
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.style.display = 'flex';
                overlay.innerHTML = `
                    <div class="modal" style="max-width: 400px;">
                        <h3>Flappy Bird</h3>
                        <canvas id="flappyCanvas" width="300" height="400" style="background: #87CEEB; display:block; margin:0 auto;"></canvas>
                        <p>Нажмите пробел или кликните, чтобы лететь. За каждую трубу +1 форум.</p>
                        <button class="btn btn-outline" id="closeFlappy">Закрыть</button>
                    </div>`;
                document.body.appendChild(overlay);
                overlay.querySelector('#closeFlappy').addEventListener('click', () => { overlay.remove(); cancelAnimationFrame(animationId); });
                overlay.addEventListener('click', (e) => { if (e.target === overlay) { overlay.remove(); cancelAnimationFrame(animationId); } });

                const canvas = overlay.querySelector('#flappyCanvas');
                const ctx = canvas.getContext('2d');
                let bird = { x: 100, y: 300, vy: 0, gravity: 0.28, jump: -6.5, size: 15 };
                let pipes = [];
                let score = 0;
                let gameOver = false;
                let animationId;

                function addPipe() {
                    const gap = 120;
                    const topHeight = Math.random() * (canvas.height - gap - 50) + 20;
                    pipes.push({ x: canvas.width, top: topHeight, bottom: canvas.height - topHeight - gap, passed: false });
                }

                function update() {
                    if (gameOver) return;
                    bird.vy += bird.gravity;
                    bird.y += bird.vy;
                    if (bird.y > canvas.height - bird.size) { bird.y = canvas.height - bird.size; bird.vy = 0; }
                    if (bird.y < bird.size) { bird.y = bird.size; bird.vy = 0; }

                    if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) addPipe();
                    pipes.forEach(p => p.x -= 2);
                    pipes = pipes.filter(p => p.x + 40 > 0);
                    pipes.forEach(p => {
                        if (!p.passed && p.x + 40 < bird.x) {
                            p.passed = true;
                            score++;
                            const user = users.find(u => u.username === currentUser);
                            user.currency = (user.currency || 0) + 1;
                            saveUsers(users);
                            updateUserUI();
                        }
                        if (bird.x + bird.size > p.x && bird.x - bird.size < p.x + 40) {
                            if (bird.y - bird.size < p.top || bird.y + bird.size > p.top + (canvas.height - p.top - p.bottom)) {
                                gameOver = true;
                            }
                        }
                    });
                }

                function draw() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(bird.x, bird.y, bird.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#228B22';
                    pipes.forEach(p => {
                        ctx.fillRect(p.x, 0, 40, p.top);
                        ctx.fillRect(p.x, canvas.height - p.bottom, 40, p.bottom);
                    });
                    ctx.fillStyle = '#000';
                    ctx.font = '20px Arial';
                    ctx.fillText('Счёт: ' + score, 10, 30);
                    if (gameOver) {
                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#fff';
                        ctx.font = '30px Arial';
                        ctx.fillText('Игра окончена', 50, 200);
                    }
                }

                function loop() {
                    update();
                    draw();
                    if (!gameOver) animationId = requestAnimationFrame(loop);
                }
                loop();

                window.addEventListener('keydown', function handler(e) {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        if (!gameOver) bird.vy = bird.jump;
                        else {
                            bird.y = 300; bird.vy = 0; pipes = []; score = 0; gameOver = false;
                            loop();
                        }
                    }
                });
                canvas.addEventListener('click', () => {
                    if (!gameOver) bird.vy = bird.jump;
                    else {
                        bird.y = 300; bird.vy = 0; pipes = []; score = 0; gameOver = false;
                        loop();
                    }
                });
            }

            let afkTimer = null;
            function toggleAFK() {
                if (!currentUser) { alert('Войдите в аккаунт'); return; }
                const user = users.find(u => u.username === currentUser);
                if (afkTimer) {
                    clearInterval(afkTimer);
                    afkTimer = null;
                    document.getElementById('afkBtn').textContent = '⏳';
                    return;
                }
                document.getElementById('afkBtn').textContent = '⏳ Активен';
                afkTimer = setInterval(() => {
                    user.currency = (user.currency || 0) + 6;
                    saveUsers(users);
                    updateUserUI();
                }, 60000);
            }

            function showAd(duration, reward) {
                if (!currentUser) { alert('Войдите в аккаунт'); return; }
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.style.display = 'flex';
                overlay.innerHTML = `
                    <div class="modal" style="max-width: 500px;">
                        <h3>Реклама</h3>
                        <div id="adContent">
                            <p>Смотрите рекламу о преимуществах Premium!</p>
                            <p>Premium даёт неоновый ник, эксклюзивные рамки, увеличенный лимит файлов и многое другое.</p>
                            <p>Купите Premium в магазине за 1000 форумов (1 день) или 3000 (3 дня).</p>
                            <p>Осталось: <span id="adTimer">${duration}</span> сек</p>
                        </div>
                        <div class="modal-actions">
                            <button class="btn btn-outline" id="cancelAd">Отмена</button>
                        </div>
                    </div>`;
                document.body.appendChild(overlay);
                overlay.querySelector('#cancelAd').addEventListener('click', () => overlay.remove());
                let secondsLeft = duration;
                const timerInterval = setInterval(() => {
                    secondsLeft--;
                    const timerEl = overlay.querySelector('#adTimer');
                    if (timerEl) timerEl.textContent = secondsLeft;
                    if (secondsLeft <= 0) {
                        clearInterval(timerInterval);
                        const user = users.find(u => u.username === currentUser);
                        user.currency = (user.currency || 0) + reward;
                        saveUsers(users);
                        updateUserUI();
                        overlay.remove();
                        alert(`Вы получили ${reward} форумов!`);
                    }
                }, 1000);
            }

            document.getElementById('flappyBtn').addEventListener('click', startFlappy);
            document.getElementById('afkBtn').addEventListener('click', toggleAFK);
            document.getElementById('adBtn').addEventListener('click', () => {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.style.display = 'flex';
                overlay.innerHTML = `
                    <div class="modal" style="max-width: 400px;">
                        <h3>Выберите рекламу</h3>
                        <button class="btn btn-primary" id="shortAd">Короткая (15 сек) — 2 форума</button>
                        <button class="btn btn-primary" id="longAd">Длинная (150 сек) — 35 форумов</button>
                        <button class="btn btn-outline" id="closeAdMenu">Закрыть</button>
                    </div>`;
                document.body.appendChild(overlay);
                overlay.querySelector('#closeAdMenu').addEventListener('click', () => overlay.remove());
                overlay.querySelector('#shortAd').addEventListener('click', () => { overlay.remove(); showAd(15, 2); });
                overlay.querySelector('#longAd').addEventListener('click', () => { overlay.remove(); showAd(150, 35); });
            });

            function roleLabel(role){ const map={head_admin:'гл.администратор',admin:'Администратор',premium:'premium',beta:'Бета-тестер',user:'Игрок'}; return map[role]||role; }
            function getFilteredTopics(searchQuery=''){ let result=[...topics]; if(searchQuery.trim()){ const q=searchQuery.toLowerCase().trim(); result=result.filter(t=>t.title.toLowerCase().includes(q)||t.author.toLowerCase().includes(q)||t.messages.some(m=>m.text.toLowerCase().includes(q))); } result.sort((a,b)=>b.id-a.id); return result; }
            function createPagination(currentPage,totalPages,type){ let html=`<button class="page-btn ${currentPage===1?'disabled':''}" data-page="${currentPage-1}" data-type="${type}">«</button>`; for(let i=1;i<=totalPages;i++) html+=`<button class="page-btn ${i===currentPage?'active':''}" data-page="${i}" data-type="${type}">${i}</button>`; html+=`<button class="page-btn ${currentPage===totalPages?'disabled':''}" data-page="${currentPage+1}" data-type="${type}">»</button>`; return html; }
            function attachPaginationHandlers(){ document.querySelectorAll('.page-btn').forEach(btn=>btn.addEventListener('click',()=>{ if(btn.classList.contains('disabled'))return; const page=parseInt(btn.dataset.page); const type=btn.dataset.type; if(type==='topics') renderTopics(page); else if(type==='topic') openTopic(currentTopicId,page); })); }

            updateUserUI();
            renderHome();
        })();
    </script>
